<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Amor Por Ti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-central">
        <h1 class="titulo-amor">¡ERES MI TODO, MI NIÑA! 🥺💖</h1>
        <p class="texto-contador">Hemos estado juntos desde hace:</p>
        <div class="contador">
            <span class="item-contador" id="dias">0</span>
            <span class="label">días</span>
            <span class="item-contador" id="horas">0</span>
            <span class="label">horas</span>
            <span class="item-contador" id="minutos">0</span>
            <span class="label">minutos</span>
        </div>
        <p class="frase-final">Y siempre te amaré más que ayer... y menos que mañana 💘</p>
    </div>
    <div class="fondo-corazones" id="fondo-corazones"></div>

    <script src="script-amor.js"></script>
</body>
</html>
